### 题目分析过程
本题属于静力学斜面受力平衡问题，核心考察斜面上静止物体的重力分力分解、静摩擦力与支持力随斜面倾角的变化规律：
1.  受力分析对象为斜面上的静止木块，木块受重力、斜面支持力、静摩擦力三力平衡
2.  重力沿斜面方向的分力为mg sinθ，垂直斜面方向的分力为mg cosθ
3.  由平衡条件可得：静摩擦力f = mg sinθ，支持力N = mg cosθ
4.  当斜面倾角θ缓慢减小时，sinθ减小、cosθ增大，因此静摩擦力f随之减小，支持力N随之增大
