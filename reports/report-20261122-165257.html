<body>
    <div class="container">
        <div class="info-section">
            <h2>物理题目：斜面上静止木块受力分析</h2>
            <div class="info-item">
                <strong>题目描述：</strong> 一木块静止在倾角为θ的固定斜面上，已知木块重力为mg，当倾角θ缓慢减小时，下列关于受力变化的说法正确的是？
            </div>
            <div class="info-item">
                <strong>知识点：</strong> 静力学平衡、斜面上物体的力的分解、静摩擦力与支持力的变化规律
            </div>
            <div class="info-item">
                <strong>核心公式：</strong>
                <div class="formula">重力沿斜面向下分力：G₁ = mg sinθ
