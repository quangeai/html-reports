### 题目分析
该题目考察斜面上静止木块的受力分析，核心知识点为重力的正交分解、静摩擦力与支持力的平衡条件，以及斜面角度变化时分力的变化规律：重力沿斜面向下的分力为mg sinθ，垂直斜面的分力为mg cosθ，木块静止时静摩擦力与沿斜面向下的分力平衡，支持力与垂直斜面的分力平衡。
